<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Budget Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="header">
      <img src="logo.svg" alt="Budget logo" class="logo">
      <h1>Weekly Budget Planner</h1>
    </div>

    <!-- Overview first -->
    <section id="overview" aria-live="polite">
      <div class="overview-grid">
        <div class="card">
          <h3>Weekly income</h3>
          <div id="weekly-income" class="big">₱0.00</div>
          <small id="monthly-income">Monthly: ₱0.00</small>
        </div>

        <div class="card">
          <h3>Expenses (weekly)</h3>
          <div id="expense-totals">Fixed: ₱0.00 · Variable: ₱0.00 · Total: ₱0.00</div>
          <canvas id="expenseChart" width="300" height="200"></canvas>
        </div>

        <div class="card full">
          <h3>Budget allocation (weekly estimate)</h3>
          <table id="alloc-table">
            <thead><tr><th>Category</th><th>Weekly</th><th>Monthly</th><th>Percent</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Inputs below -->
    <section id="income">
      <label>Biweekly Income: <input id="income-input" type="number" step="0.01" placeholder="0.00"></label>
      <button id="save-income">Save</button>
    </section>

    <section>
      <h2>Fixed Costs</h2>
      <table id="fixed-table">
        <thead><tr><th>Name</th><th>Amount</th><th>Frequency</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button id="add-fixed">Add fixed cost</button>
    </section>

    <section>
      <h2>Variable Costs</h2>
      <table id="variable-table">
        <thead><tr><th>Name</th><th>Min</th><th>Max</th><th>Frequency</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button id="add-variable">Add variable cost</button>
    </section>

    <div class="actions">
      <button id="export-csv">Export CSV</button>
      <button id="clear">Clear All</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
